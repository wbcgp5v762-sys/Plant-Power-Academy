<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c30"><title>Plant Power Academy</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e8f1ff;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}header{padding:23px 18px;background:#14243d;border-bottom:1px solid #304967}h1{font-size:25px;margin:0 0 5px}small,.muted{color:#a6bbd5}main{max-width:760px;margin:auto;padding:16px}.card{background:#16253b;border:1px solid #344963;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 15px #0002}h2{font-size:21px;margin:0 0 10px}h3{font-size:17px}button,input{font:inherit}button{cursor:pointer;border:1px solid #52749d;background:#233c5c;color:#fff;border-radius:12px;padding:13px;margin:5px 4px 5px 0;min-height:46px}button.primary{background:#176fba;border-color:#4b9fe0;font-weight:700}button:disabled{opacity:.4}button.selected{outline:2px solid #80d6ff}nav{display:flex;gap:5px;overflow-x:auto;padding:12px 16px;background:#101d30}nav button{flex:1;white-space:nowrap;margin:0;padding:10px}.progress{height:10px;background:#30435b;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#49bb92}.choice{display:block;width:100%;text-align:left}.good{color:#8ff0ba}.bad{color:#ffaeae}.diagram{border:1px solid #496687;border-radius:14px;padding:15px;margin:12px 0;text-align:center;background:#0b1a2d;font-size:19px;line-height:2}input{background:#0c1b2d;color:#fff;border:1px solid #59728e;border-radius:9px;padding:12px;width:100%}.pill{display:inline-block;background:#314b68;border-radius:30px;padding:5px 10px;font-size:13px;margin:4px}.hide{display:none}footer{padding:25px;text-align:center;color:#92a7c3;font-size:12px}p{line-height:1.55}</style></head><body>
<header><h1>⚡ Plant Power Academy</h1><small>Electrical & controls career simulator • Water, wastewater & tunnels</small></header>
<nav><button onclick="tab('career')">Career</button><button onclick="tab('lab')">Circuit Lab</button><button onclick="tab('reference')">Reference</button></nav>
<main><section id="career"></section><section id="lab" class="hide"></section><section id="reference" class="hide"></section></main><footer>Educational simulation only. Never use as a live wiring, safety, or commissioning procedure.</footer>
<script>
const missions=[["Electrical Apprentice", "Voltage, Current & Resistance", "Voltage is electrical pressure (volts). Current is charge flow (amps). Resistance opposes flow (ohms). Ohm\u2019s law: I = V \u00f7 R.", "A 12 V battery pushes current through a 6 \u03a9 load. What current flows?", ["2 A", "6 A", "72 A"], 0, "12 \u00f7 6 = 2 amperes."], ["Electrical Apprentice", "Build a Complete Circuit", "A circuit needs a source, a complete conductive path, and a load. An open switch interrupts current. A closed switch completes the path.", "With a switch open, what happens to the lamp?", ["It gets brighter", "It goes off", "Voltage doubles"], 1, "An open switch interrupts the path."], ["Electrical Technician", "Breakers, Fuses & Safety", "Overcurrent protective devices interrupt excessive current. A breaker is not a substitute for lockout/tagout and verification of absence of voltage.", "What is the first safe response before servicing a panel?", ["Follow LOTO and verify absence of voltage", "Trust the OFF label", "Touch a wire briefly"], 0, "Only qualified personnel should perform electrical work using approved LOTO and test procedures."], ["Electrical Technician", "Transformers & Distribution", "Transformers use magnetic induction to change AC voltage. A single-line diagram shows major power distribution equipment and protective devices.", "A transformer steps 480 V down to 120 V. What happens to voltage?", ["It quadruples", "It is reduced", "It becomes DC"], 1, "Transformers change AC voltage; they do not inherently convert AC to DC."], ["Motor Controls Technician", "Three-Phase Motors", "Three-phase motors use rotating magnetic fields. Contactors switch motor power; overload relays protect against sustained overloads.", "Which device commonly opens motor power when commanded by a control circuit?", ["Contactor", "Level transmitter", "Pressure gauge"], 0, "The contactor uses a coil to operate its power contacts."], ["Motor Controls Technician", "Variable Frequency Drives", "A VFD adjusts motor speed by varying output frequency and voltage. It typically rectifies incoming AC to DC, then inverts it back to controlled AC.", "For a centrifugal pump, reducing motor speed with a VFD generally does what?", ["Reduces flow", "Always increases flow", "Has no effect"], 0, "For many centrifugal pump applications, flow roughly tracks speed."], ["PLC Technician", "Digital Inputs & Outputs", "A PLC reads inputs, executes logic, and updates outputs. A float switch can be a discrete input; a motor starter command can be an output.", "A high-level float switch is wired to a PLC. It is usually a:", ["Digital input", "Motor power output", "Transformer"], 0, "A float switch provides a discrete state."], ["PLC Technician", "Interlocks & Logic", "An interlock prevents unsafe or undesired operation. In ladder logic, AND conditions require all permissives to be true; OR requires at least one.", "Pump may run only when AUTO is selected AND low-level trip is clear. If trip activates:", ["Pump must stop", "Pump must speed up", "Nothing changes"], 0, "The permissive is lost."], ["SCADA Operator", "Sensors & 4\u201320 mA", "Transmitters turn physical measurements into electrical signals. A common 4\u201320 mA signal represents a calibrated measurement span.", "A 0\u2013100 psi transmitter reads 12 mA. Approximately what pressure?", ["25 psi", "50 psi", "75 psi"], 1, "12 mA is halfway between 4 and 20 mA, so 50 psi."], ["SCADA Operator", "SCADA & HMI", "SCADA supervises equipment through controllers and networks. An HMI is the operator display; it does not replace independent safety systems.", "Which screen typically lets an operator see tank levels and alarms?", ["HMI", "Transformer nameplate", "Conduit schedule"], 0, "The HMI visualizes process data and commands."], ["Process Controls Engineer", "Lift Station Control", "Wet wells use level instruments and lead/lag pump sequencing. High-high level alarms indicate potential overflow risk.", "When wet-well level rises above lead start, the controller typically:", ["Starts the lead pump", "Stops all pumps", "Closes every valve"], 0, "The lead pump starts if permissives are satisfied."], ["Process Controls Engineer", "Chemical Dosing", "Chemical feed can be paced to water flow and corrected using process feedback. Interlocks prevent dosing with no flow.", "If process flow stops, a properly interlocked chemical feed pump should:", ["Stop", "Double its speed", "Ignore the flow signal"], 0, "No-flow interlocks help prevent overfeed."], ["Tunnel Systems Engineer", "Ventilation & VFD Control", "Tunnel fans, dampers, sensors, and motor drives work as coordinated systems. Fire mode may override normal ventilation sequences.", "Before starting a fan, a control sequence may verify:", ["Required damper position", "Paint color", "Office temperature"], 0, "Damper end switches may be part of start permissives."], ["Tunnel Systems Engineer", "Fire Alarm & Deluge", "Detection, alarm, and suppression are distinct functions. Deluge systems use open discharge devices and a controlled valve; activation logic is project-specific.", "What is the purpose of a deluge valve?", ["Control water admission to open sprinklers", "Convert AC to DC", "Measure airflow"], 0, "A deluge valve controls the water supply to the open-nozzle network."], ["Commissioning Engineer", "Troubleshoot a Pump", "Use drawings, alarms, PLC status, field device indications, and a controlled test plan. Never bypass protective interlocks without authorization.", "A pump fails to start and the low-level permissive is false. What should you investigate first?", ["Level signal and actual wet-well level", "Replace motor immediately", "Jumper the interlock"], 0, "Check the reason for the inhibited start; do not bypass safeguards."], ["Commissioning Engineer", "Functional Acceptance Testing", "Commissioning checks point-to-point wiring, instrument calibration, interlocks, alarms, control sequences, and documented acceptance criteria.", "A simulated high-high tank level should trigger what?", ["The specified alarm and programmed response", "An unplanned breaker trip", "No record"], 0, "Compare actual response with approved sequence of operations."]], glossary={"AC": "Alternating current; direction reverses periodically.", "DC": "Direct current; flows in one direction.", "Ampere": "Unit of electric current.", "Volt": "Unit of electrical potential difference.", "Ohm": "Unit of resistance.", "Watt": "Unit of power; for DC, P = V \u00d7 I.", "Breaker": "Resettable overcurrent protective device.", "Contactor": "Electrically operated power switch.", "Overload relay": "Motor protection for sustained overload.", "Transformer": "Device that changes AC voltage using induction.", "VFD": "Variable frequency drive; adjusts AC motor speed.", "PLC": "Programmable logic controller; executes industrial control logic.", "SCADA": "Supervisory control and data acquisition.", "HMI": "Human-machine interface; operator display.", "4\u201320 mA": "Analog instrument signal with live zero at 4 mA.", "Interlock": "Condition that prevents or limits an operation.", "LOTO": "Lockout/tagout; hazardous energy control procedure.", "Deluge valve": "Valve admitting water to a deluge sprinkler network.", "P&ID": "Piping and instrumentation diagram.", "Single-line diagram": "Simplified electrical distribution drawing."};
let done=Number(localStorage.getItem('ppa_done')||0),active=Math.min(done,missions.length-1),answered=false,labSwitch=false,voltage=12,resistance=6;
const $=id=>document.getElementById(id);
function tab(id){['career','lab','reference'].forEach(x=>$(x).classList.toggle('hide',x!==id));if(id==='career')career();if(id==='lab')lab();if(id==='reference')reference()}
function career(){let m=missions[active];$('career').innerHTML=`<div class="card"><b>${done}/${missions.length} assignments completed</b><div class="progress"><div style="width:${100*done/missions.length}%"></div></div><p class="muted">Career stage: ${missions[Math.min(done,15)][0]}</p></div><div class="card"><h2>Assignment ${active+1}: ${m[1]}</h2><span class="pill">${m[0]}</span><h3>Learn</h3><p>${m[2]}</p><h3>Field challenge</h3><p>${m[3]}</p><div id="answers">${m[4].map((x,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><p id="feedback"></p><button class="primary" id="next" style="display:none" onclick="advance()">Continue →</button></div><div class="card"><h3>Assignment map</h3>${missions.map((x,i)=>`<button ${i>done?'disabled':''} onclick="active=${i};answered=false;career()">${i<done?'✓ ':''}${i+1}. ${x[1]}</button>`).join('')}</div>`}
function answer(i){if(answered)return;let m=missions[active],ok=i===m[5];$('feedback').innerHTML=`<strong class="${ok?'good':'bad'}">${ok?'Correct! +100 XP':'Not quite. Try again.'}</strong> ${ok?m[6]:'Hint: '+m[2]}`;if(ok){answered=true;$('next').style.display='inline-block';[...$('answers').children].forEach(b=>b.disabled=true)}}
function advance(){if(active===done){done=Math.min(done+1,missions.length);localStorage.setItem('ppa_done',done)}active=Math.min(done,missions.length-1);answered=false;career();window.scrollTo(0,0);if(done===missions.length){$('feedback').innerHTML='<b class="good">All 16 assignments completed. Commissioning Engineer achieved!</b>'}}
function lab(){let current=labSwitch?voltage/resistance:0,power=voltage*current;$('lab').innerHTML=`<div class="card"><h2>Interactive DC Circuit Lab</h2><p>Explore a battery, switch and resistive lamp. Change the voltage or resistance, then close the switch to see the calculated current.</p><div class="diagram">🔋 ${voltage} V ━━ ${labSwitch?'🟢 CLOSED':'🔴 OPEN'} ━━ ${labSwitch?'💡':'⚫'}<br>↳ ━━━━━━━━━━━━━ ↲</div><button class="primary" onclick="labSwitch=!labSwitch;lab()">${labSwitch?'Open':'Close'} switch</button><p>Battery voltage: <b>${voltage} V</b></p><button onclick="voltage=Math.max(3,voltage-3);lab()">− 3 V</button><button onclick="voltage=Math.min(24,voltage+3);lab()">+ 3 V</button><p>Load resistance: <b>${resistance} Ω</b></p><button onclick="resistance=Math.max(3,resistance-3);lab()">− 3 Ω</button><button onclick="resistance=Math.min(24,resistance+3);lab()">+ 3 Ω</button><h3>Measurements</h3><p>Current: <b>${current.toFixed(2)} A</b> | Load power: <b>${power.toFixed(1)} W</b></p><p class="muted">Idealized DC model; not a wiring guide. The switch is assumed ideal.</p></div>`}
function reference(){let term=$('search')?.value||'';$('reference').innerHTML=`<div class="card"><h2>Engineering reference library</h2><input id="search" placeholder="Search electrical terms" value="${term.replace(/"/g,'&quot;')}" oninput="filterTerms()"><div id="terms"></div></div>`;filterTerms()}
function filterTerms(){let s=$('search').value.toLowerCase();$('terms').innerHTML=Object.entries(glossary).filter(([k,v])=>(k+' '+v).toLowerCase().includes(s)).map(([k,v])=>`<p><b>${k}</b><br>${v}</p>`).join('')||'<p>No matching terms.</p>'}
career();
</script></body></html>
